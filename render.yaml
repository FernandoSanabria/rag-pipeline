# Render Blueprint — deploy the FastAPI service as a Docker web service.
# Deploy is the operator's action: connect the repo in the Render dashboard (or `render blueprint
# launch`), then set the two secret values below. This file contains NO secret values.
services:
  - type: web
    name: equip-docs-rag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main             # deploys from main (the protected branch)
    autoDeploy: true         # auto-deploy on every push to main (safe: main is branch-protected)
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false            # set in the Render dashboard / secret store; never committed
      - key: PINECONE_API_KEY
        sync: false            # set in the Render dashboard / secret store; never committed
      - key: INDEX_NAME
        value: equip-docs-rag
      # Production retrieval namespace pinned EXPLICITLY (declared == live, auditable in git).
      # render.yaml env WINS over the src/config.py default, so this is the source of truth in prod.
      # ROLLBACK = change the value below to `semantic` via a one-line PR (reviewable, in git
      # history — the documented revert path). A dashboard env override also works but is
      # EMERGENCY-ONLY: it creates declared-vs-live drift until removed.
      - key: RETRIEVAL_NAMESPACE
        value: semantic_v2
      # RETRIEVAL_K omitted on purpose — the shipped k=10 default lives in src/config.py.
      # G10b approval gate (eval/g10b_design.md, durability option A): the SQLite file that holds paused reviews.
      # Render's free plan has no persistent disk, so a pause does NOT survive a redeploy, restart or spin-down; the
      # resume then fails closed ("expired or lost") and never answers unreviewed. Unset = no checkpointer: a question
      # the gate fires on is refused.
      - key: REVIEW_DB_PATH
        value: /app/var/review.sqlite
