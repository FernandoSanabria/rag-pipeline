name: post-deploy-wire-smoke
run-name: ${{ github.event.inputs.simulate_failure == 'true' && 'post-deploy-wire-smoke — SIMULATED FAILURE (intentional red, negative proof)' || 'post-deploy-wire-smoke' }}

# Post-deploy wire-smoke: after a code deploy to `main`, verify the DEPLOYED artifact actually serves the
# routes. This is the layer-six check — CI validates the code; this validates that the image contains it.
# The bug it exists to catch: a missing `COPY` crashes the new image on startup, Render keeps the last
# healthy image, and the new route 404s. Tests can't see that (they run against the repo); only a request
# against the running service can.
#
# Tolerant of cold starts and deploy-in-progress (retry on 000/502/503/timeout); intolerant of 404/500,
# the signature of "the image doesn't contain the code" — but a hard code must PERSIST (rule out a
# straggler deploy still serving the old image) before we fail. Post-merge only: it runs after the merge
# that triggers it and therefore cannot gate that merge, so it is deliberately NOT a required check.
#
# NEGATIVE PROOF: a deliberate `workflow_dispatch` run with `simulate_failure: true` exists in this
# workflow's Actions history (first run ~2026-08-09), intentionally red-by-design. It asserts the two
# intolerant paths (persistent-hard 404/500 and shape-mismatch) genuinely fail the job rather than being
# swallowed by the retry logic. That red entry is evidence for the discipline, not a broken pipeline — the
# run is named "SIMULATED FAILURE" and its ::error:: lines are prefixed "SIMULATED —".

on:
  push:
    branches: [main]
    paths:                    # only fire on changes that can alter the deployed artifact
      - "src/**"
      - "api/**"
      - "agent/**"
      - "Dockerfile"
      - "render.yaml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Dispatch-only NEGATIVE PROOF — assert the intolerant paths fail the job (intentionally red). Leave false for a normal smoke."
        type: boolean
        default: false

jobs:
  wire-smoke:
    name: wire-smoke
    runs-on: ubuntu-latest
    env:
      BASE: https://equip-docs-rag-api.onrender.com
      SIMULATE_FAILURE: ${{ github.event.inputs.simulate_failure || 'false' }}
      INITIAL_DELAY: "90"      # wait for Render to swap in the new image before polling (measured deploy ~52s + margin)
      BUDGET_SECS: "600"       # per-route poll budget (~10 min): covers a cold build + free-tier wake
      INTERVAL: "15"
      HARD_STREAK: "3"         # a 404/500 must repeat this many times (~45s) before we fail — straggler-deploy guard
    steps:
      - name: Wire-smoke the deployed service (shape, not content)
        shell: bash
        run: |
          set -uo pipefail

          # Map an HTTP code to an action. 200=ok; 404/500=hard (the bug); everything else (000 timeout/
          # conn, 502, 503) = retry (cold start or deploy in progress).
          classify() { case "$1" in 200) echo ok;; 404|500) echo hard;; *) echo retry;; esac; }

          # hit METHOD PATH [JSON] -> prints the body, then a final line with the HTTP status code.
          hit() {
            local m="$1" p="$2" d="${3:-}"
            if [ "$m" = GET ]; then
              curl -s -m 90 -w $'\n%{http_code}' "$BASE$p" 2>/dev/null || printf '\n000'
            else
              curl -s -m 90 -X POST -H 'content-type: application/json' -d "$d" -w $'\n%{http_code}' "$BASE$p" 2>/dev/null || printf '\n000'
            fi
          }

          # poll METHOD PATH JSON SHAPE [BUDGET] -> 0 on 200+shape; 1 when a hard code persists or budget expires.
          # SHAPE is a jq filter that must be truthy (empty = 200 is enough). ${ERR_PREFIX:-} lets the negative
          # proof label its ::error:: as SIMULATED without poll needing to know it's a simulation.
          poll() {
            local m="$1" p="$2" d="$3" shape="$4" budget="${5:-$BUDGET_SECS}"
            local deadline=$(( $(date +%s) + budget )) streak=0
            while :; do
              local out code body kind
              out="$(hit "$m" "$p" "$d")"
              code="$(printf '%s' "$out" | tail -n1)"
              body="$(printf '%s' "$out" | sed '$d')"
              kind="$(classify "$code")"
              echo "  $m $p -> HTTP $code ($kind)"
              case "$kind" in
                ok)
                  if [ -z "$shape" ] || printf '%s' "$body" | jq -e "$shape" >/dev/null 2>&1; then return 0; fi
                  echo "  ::error::${ERR_PREFIX:-}200 but shape check failed ($shape)"; return 1 ;;
                hard)
                  streak=$(( streak + 1 ))
                  if [ "$streak" -ge "$HARD_STREAK" ]; then
                    echo "  ::error::${ERR_PREFIX:-}$m $p returned $code on $streak consecutive checks — the deployed image does not serve this route"
                    return 1
                  fi
                  echo "  hard $code ($streak/$HARD_STREAK) — re-checking to rule out a straggler deploy" ;;
                retry)
                  streak=0 ;;
              esac
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "  ::error::${ERR_PREFIX:-}$m $p did not reach 200+shape within ${budget}s"; return 1
              fi
              sleep "$INTERVAL"
            done
          }

          # --- NEGATIVE PROOF (dispatch-only): assert BOTH intolerant paths fail the job, then red on purpose.
          # Real deploys never reach this (simulate_failure defaults false). Runs before the initial delay.
          if [ "${SIMULATE_FAILURE:-false}" = "true" ]; then
            export ERR_PREFIX="SIMULATED — "
            echo "== SIMULATED FAILURE (negative proof) — this run is INTENTIONALLY red =="

            echo "-- shape-failure path: GET /health returns 200 but the body fails the jq shape --"
            ( poll GET /health '' 'has("definitely_not_a_field")' 30 ); rc=$?
            [ "$rc" -ne 0 ] || { echo "::error::SIMULATED — shape-check branch returned 0 on an unsatisfiable shape; the shape path does not fail"; exit 1; }
            echo "  shape path returned non-zero as required (rc=$rc)"

            echo "-- persistent-hard path: a route that cannot exist; budget 90s > streak window 45s so it fails on the hard branch --"
            ( poll POST /ask/definitely-not-a-route '{"question":"x"}' '' 90 ); rc=$?
            [ "$rc" -ne 0 ] || { echo "::error::SIMULATED — persistent-hard branch returned 0 on a permanent 404; the hard path does not fail"; exit 1; }
            echo "  persistent-hard path returned non-zero as required (rc=$rc)"

            echo "::error::SIMULATED FAILURE (negative proof): both intolerant paths went red as required; failing the job intentionally"
            exit 1
          fi

          # Straggler-deploy risk (noted, not tuned): INITIAL_DELAY 90s + streak window (HARD_STREAK*INTERVAL=45s)
          # ~= 135s tolerance vs a measured ~52s deploy. A uv.lock/pyproject.toml build that ALSO adds a new route
          # in the same push could 404 past that window and false-red. Rare; raise INITIAL_DELAY if it ever fires.
          echo "== initial delay ${INITIAL_DELAY}s: let the newly-deployed image become the one serving =="
          sleep "$INITIAL_DELAY"

          echo "== GET /health -> 200 =="
          poll GET /health '' '' || exit 1

          # Negative self-test: prove the intolerant half is real — a bogus route must be seen as 404 and
          # classified `hard`. Direct assertion (not via poll) so a *passing* run stays annotation-clean;
          # runs after /health is 200, so the service is up and the bogus route reliably 404s.
          echo "== negative self-test: a bogus route MUST classify as a hard failure =="
          nt="$(hit POST /ask/definitely-not-a-route '{"question":"x"}')"
          nt_code="$(printf '%s' "$nt" | tail -n1)"
          echo "  POST /ask/definitely-not-a-route -> HTTP $nt_code (classify: $(classify "$nt_code"))"
          if [ "$nt_code" = "404" ] && [ "$(classify "$nt_code")" = "hard" ]; then
            echo "  OK: 404 is classified 'hard' — the intolerant half fails rather than retries or swallows"
          else
            echo "::error::negative self-test failed: bogus route returned $nt_code (classify $(classify "$nt_code")), expected 404/hard"
            exit 1
          fi

          echo '== POST /ask -> 200 + has(answer, citations) =='
          poll POST /ask '{"question":"What is the RMP threshold quantity for anhydrous ammonia?"}' 'has("answer") and has("citations")' || exit 1

          echo '== POST /ask/agent -> 200 + has(answer, route) =='
          poll POST /ask/agent '{"question":"flash point of acetone per the Sigma-Aldrich SDS?"}' 'has("answer") and has("route")' || exit 1

          echo "All routes green: the deployed artifact serves /health, /ask, and /ask/agent."
